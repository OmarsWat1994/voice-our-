
name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Update Android SDK version to 36
        run: |
          sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion.*/targetSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/compileSdk.*/compileSdk 36/g' android/app/build.gradle || true
          sed -i 's/targetSdk.*/targetSdk 36/g' android/app/build.gradle || true

      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
